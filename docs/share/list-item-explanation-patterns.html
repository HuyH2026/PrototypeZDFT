:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;

  margin: 0;

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);

  text-decoration: none;
  white-space: nowrap;
  user-select: none;

}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {

  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:

    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;

  mask: var(--checkmark-image) center / 12px 12px no-repeat;

  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&quot;risk-safety-list-patterns&quot;);
    if (!root) return;

    const infoIcon = `
      &lt;svg viewBox=&quot;0 0 16 16&quot; aria-hidden=&quot;true&quot;&gt;
        &lt;circle cx=&quot;8&quot; cy=&quot;8&quot; r=&quot;6.2&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.4&quot;&gt;&lt;/circle&gt;
        &lt;path d=&quot;M8 7.1v4&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.4&quot; stroke-linecap=&quot;round&quot;&gt;&lt;/path&gt;
        &lt;circle cx=&quot;8&quot; cy=&quot;4.7&quot; r=&quot;.8&quot; fill=&quot;currentColor&quot;&gt;&lt;/circle&gt;
      &lt;/svg&gt;`;

    const items = [
      {
        id: &quot;impersonation&quot;,
        label: &quot;Impersonation&quot;,
        value: &quot;impersonation&quot;,
        explanation: &quot;Pretending to be another person or organization in a way that could mislead or harm someone.&quot;
      },
      {
        id: &quot;financial-exploitation&quot;,
        label: &quot;Financial exploitation&quot;,
        value: &quot;financial_exploitation&quot;,
        explanation: &quot;Taking or controlling someone&#x27;s money or property through pressure, deception, or abuse of trust.&quot;
      },
      {
        id: &quot;hate-abuse&quot;,
        label: &quot;Hateful or abusive content&quot;,
        value: &quot;hateful_or_abusive&quot;,
        explanation: &quot;Content that attacks, threatens, or degrades a person or group, especially based on a protected characteristic.&quot;
      },
      {
        id: &quot;sexual-harassment&quot;,
        label: &quot;Sexual harassment&quot;,
        value: &quot;sexual_harassment&quot;,
        explanation: &quot;Unwanted sexual conduct, comments, or advances that make a person feel intimidated, degraded, or unsafe.&quot;
      },
      {
        id: &quot;physical-assault&quot;,
        label: &quot;Physical force or assault&quot;,
        value: &quot;physical_force_or_assault&quot;,
        explanation: &quot;The use or threat of physical force against another person without their consent.&quot;
      },
      {
        id: &quot;stalking&quot;,
        label: &quot;Stalking or harassment&quot;,
        value: &quot;stalking_or_harassment&quot;,
        explanation: &quot;Repeated unwanted contact, monitoring, or pursuit that causes fear or serious distress.&quot;
      }
    ];

    const content = root.querySelector(&quot;#list-pattern-content&quot;);
    const summary = root.querySelector(&quot;.pattern-summary&quot;);
    const modal = root.querySelector(&quot;.list-modal&quot;);
    const patternButtons = Array.from(root.querySelectorAll(&quot;[data-pattern]&quot;));
    let activePattern = &quot;popover&quot;;
    let openId = &quot;financial-exploitation&quot;;
    let pinnedId = &quot;financial-exploitation&quot;;
    let selectedId = &quot;hate-abuse&quot;;

    const escapeHtml = (value) =&gt; String(value)
      .replaceAll(&quot;&amp;&quot;, &quot;&amp;amp;&quot;)
      .replaceAll(&quot;&lt;&quot;, &quot;&amp;lt;&quot;)
      .replaceAll(&quot;&gt;&quot;, &quot;&amp;gt;&quot;)
      .replaceAll(&#x27;&quot;&#x27;, &quot;&amp;quot;&quot;)
      .replaceAll(&quot;&#x27;&quot;, &quot;&amp;#039;&quot;);

    const headerMarkup = () =&gt; `
      &lt;div class=&quot;list-grid-header&quot;&gt;
        &lt;span class=&quot;column-label&quot;&gt;Label
          &lt;button type=&quot;button&quot; class=&quot;header-help&quot; aria-label=&quot;About the Label field&quot; data-tip=&quot;The text people see when choosing this option.&quot;&gt;${infoIcon}&lt;/button&gt;
        &lt;/span&gt;
        &lt;span class=&quot;column-label&quot;&gt;Value
          &lt;button type=&quot;button&quot; class=&quot;header-help&quot; aria-label=&quot;About the Value field&quot; data-tip=&quot;The stable data stored or submitted when this option is chosen.&quot;&gt;${infoIcon}&lt;/button&gt;
        &lt;/span&gt;
        &lt;span class=&quot;column-label&quot;&gt;Explanation
          &lt;button type=&quot;button&quot; class=&quot;header-help&quot; aria-label=&quot;About the Explanation field&quot; data-tip=&quot;Plain-language help shown when someone asks what this option means.&quot;&gt;${infoIcon}&lt;/button&gt;
        &lt;/span&gt;
        &lt;span class=&quot;sr-only&quot;&gt;Preview explanation&lt;/span&gt;
        &lt;span class=&quot;sr-only&quot;&gt;Remove&lt;/span&gt;
      &lt;/div&gt;`;

    const fieldsMarkup = (item) =&gt; `
      &lt;label class=&quot;field-wrap&quot;&gt;
        &lt;span class=&quot;mobile-field-label&quot;&gt;Label&lt;/span&gt;
        &lt;input class=&quot;text-field&quot; data-item-id=&quot;${item.id}&quot; data-field=&quot;label&quot; aria-label=&quot;Label for ${escapeHtml(item.label)}&quot; value=&quot;${escapeHtml(item.label)}&quot; /&gt;
      &lt;/label&gt;
      &lt;label class=&quot;field-wrap&quot;&gt;
        &lt;span class=&quot;mobile-field-label&quot;&gt;Value&lt;/span&gt;
        &lt;input class=&quot;text-field&quot; data-item-id=&quot;${item.id}&quot; data-field=&quot;value&quot; aria-label=&quot;Value for ${escapeHtml(item.label)}&quot; value=&quot;${escapeHtml(item.value)}&quot; /&gt;
      &lt;/label&gt;
      &lt;label class=&quot;field-wrap&quot;&gt;
        &lt;span class=&quot;mobile-field-label&quot;&gt;Explanation&lt;/span&gt;
        &lt;input class=&quot;text-field&quot; data-item-id=&quot;${item.id}&quot; data-field=&quot;explanation&quot; aria-label=&quot;Explanation for ${escapeHtml(item.label)}&quot; value=&quot;${escapeHtml(item.explanation)}&quot; /&gt;
      &lt;/label&gt;`;

    const definitionMarkup = (item, className, id, role = &quot;region&quot;) =&gt; `
      &lt;div class=&quot;${className}&quot; id=&quot;${id}&quot; role=&quot;${role}&quot;&gt;
        &lt;strong data-preview-label=&quot;${item.id}&quot;&gt;${escapeHtml(item.label)}&lt;/strong&gt;
        &lt;p class=&quot;definition-copy&quot; data-preview-explanation=&quot;${item.id}&quot;&gt;${escapeHtml(item.explanation || &quot;No explanation added.&quot;)}&lt;/p&gt;
        ${className === &quot;definition-popover&quot; ? &#x27;&lt;p class=&quot;hint&quot;&gt;Click to keep open · Esc to close&lt;/p&gt;&#x27; : &#x27;&#x27;}
      &lt;/div&gt;`;

    const renderPopover = () =&gt; {
      content.innerHTML = `
        ${headerMarkup()}
        &lt;div class=&quot;rows&quot;&gt;
          ${items.map((item) =&gt; {
            const isOpen = item.id === openId;
            return `
              &lt;div class=&quot;list-row-wrap&quot; data-row-id=&quot;${item.id}&quot;&gt;
                &lt;div class=&quot;list-grid-row&quot;&gt;
                  ${fieldsMarkup(item)}
                  &lt;button type=&quot;button&quot; class=&quot;term-help&quot; data-help-id=&quot;${item.id}&quot; aria-label=&quot;About ${escapeHtml(item.label)}&quot; aria-expanded=&quot;${isOpen}&quot; aria-describedby=&quot;definition-${item.id}&quot;&gt;${infoIcon}&lt;/button&gt;
                  &lt;button type=&quot;button&quot; class=&quot;remove-row&quot; aria-label=&quot;Remove ${escapeHtml(item.label)}&quot;&gt;×&lt;/button&gt;
                &lt;/div&gt;
                ${isOpen ? definitionMarkup(item, &quot;definition-popover&quot;, `definition-${item.id}`, &quot;tooltip&quot;) : &#x27;&#x27;}
              &lt;/div&gt;`;
          }).join(&quot;&quot;)}
        &lt;/div&gt;`;
      attachPopoverInteractions();
      attachFieldInteractions();
    };

    const renderInline = () =&gt; {
      content.innerHTML = `
        ${headerMarkup()}
        &lt;div class=&quot;rows&quot;&gt;
          ${items.map((item) =&gt; {
            const isOpen = item.id === openId;
            return `
              &lt;div class=&quot;list-row-wrap&quot; data-row-id=&quot;${item.id}&quot;&gt;
                &lt;div class=&quot;list-grid-row&quot;&gt;
                  ${fieldsMarkup(item)}
                  &lt;button type=&quot;button&quot; class=&quot;term-help&quot; data-help-id=&quot;${item.id}&quot; aria-label=&quot;${isOpen ? &#x27;Hide&#x27; : &#x27;Show&#x27;} explanation for ${escapeHtml(item.label)}&quot; aria-expanded=&quot;${isOpen}&quot; aria-controls=&quot;inline-${item.id}&quot;&gt;${infoIcon}&lt;/button&gt;
                  &lt;button type=&quot;button&quot; class=&quot;remove-row&quot; aria-label=&quot;Remove ${escapeHtml(item.label)}&quot;&gt;×&lt;/button&gt;
                &lt;/div&gt;
                ${isOpen ? definitionMarkup(item, &quot;inline-explanation&quot;, `inline-${item.id}`) : &#x27;&#x27;}
              &lt;/div&gt;`;
          }).join(&quot;&quot;)}
        &lt;/div&gt;`;
      content.querySelectorAll(&quot;[data-help-id]&quot;).forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          openId = openId === button.dataset.helpId ? &quot;&quot; : button.dataset.helpId;
          renderInline();
          const next = content.querySelector(`[data-help-id=&quot;${openId}&quot;]`);
          if (next) next.focus();
        });
      });
      attachFieldInteractions();
    };

    const renderPanel = () =&gt; {
      const selectedItem = items.find((item) =&gt; item.id === selectedId) || items[0];
      content.innerHTML = `
        &lt;div class=&quot;split-layout&quot;&gt;
          &lt;div class=&quot;panel-list&quot;&gt;
            ${headerMarkup()}
            &lt;div class=&quot;rows&quot;&gt;
              ${items.map((item) =&gt; `
                &lt;div class=&quot;list-row-wrap&quot;&gt;
                  &lt;div class=&quot;list-grid-row&quot; data-selected=&quot;${item.id === selectedItem.id}&quot;&gt;
                    ${fieldsMarkup(item)}
                    &lt;button type=&quot;button&quot; class=&quot;term-help&quot; data-select-id=&quot;${item.id}&quot; aria-label=&quot;Preview explanation for ${escapeHtml(item.label)}&quot; aria-pressed=&quot;${item.id === selectedItem.id}&quot;&gt;${infoIcon}&lt;/button&gt;
                    &lt;button type=&quot;button&quot; class=&quot;remove-row&quot; aria-label=&quot;Remove ${escapeHtml(item.label)}&quot;&gt;×&lt;/button&gt;
                  &lt;/div&gt;
                &lt;/div&gt;`).join(&quot;&quot;)}
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;aside class=&quot;details-panel&quot; aria-live=&quot;polite&quot;&gt;
            &lt;div class=&quot;eyebrow&quot;&gt;Plain-language explanation&lt;/div&gt;
            &lt;h3 data-preview-label=&quot;${selectedItem.id}&quot;&gt;${escapeHtml(selectedItem.label)}&lt;/h3&gt;
            &lt;p class=&quot;definition-copy&quot; data-preview-explanation=&quot;${selectedItem.id}&quot;&gt;${escapeHtml(selectedItem.explanation || &quot;No explanation added.&quot;)}&lt;/p&gt;
            &lt;div class=&quot;guidance&quot;&gt;
              &lt;b&gt;When to use this option&lt;/b&gt;
              &lt;p&gt;Choose it when the reported behavior closely matches this definition. If unsure, follow your escalation policy.&lt;/p&gt;
            &lt;/div&gt;
          &lt;/aside&gt;
        &lt;/div&gt;`;
      content.querySelectorAll(&quot;[data-select-id]&quot;).forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          selectedId = button.dataset.selectId;
          renderPanel();
          const next = content.querySelector(`[data-select-id=&quot;${selectedId}&quot;]`);
          if (next) next.focus();
        });
      });
      attachFieldInteractions();
    };

    const attachFieldInteractions = () =&gt; {
      content.querySelectorAll(&quot;[data-item-id][data-field]&quot;).forEach((input) =&gt; {
        input.addEventListener(&quot;input&quot;, () =&gt; {
          const item = items.find((candidate) =&gt; candidate.id === input.dataset.itemId);
          const field = input.dataset.field;
          if (!item || !field || ![&quot;label&quot;, &quot;value&quot;, &quot;explanation&quot;].includes(field)) return;
          item[field] = input.value;

          if (field === &quot;label&quot;) {
            content.querySelectorAll(`[data-preview-label=&quot;${item.id}&quot;]`).forEach((preview) =&gt; {
              preview.textContent = input.value || &quot;Untitled option&quot;;
            });
          }

          if (field === &quot;explanation&quot;) {
            content.querySelectorAll(`[data-preview-explanation=&quot;${item.id}&quot;]`).forEach((preview) =&gt; {
              preview.textContent = input.value || &quot;No explanation added.&quot;;
            });
          }
        });
      });
    };

    const attachPopoverInteractions = () =&gt; {
      content.querySelectorAll(&quot;[data-help-id]&quot;).forEach((button) =&gt; {
        const id = button.dataset.helpId;
        const row = button.closest(&quot;[data-row-id]&quot;);
        if (!row) return;

        button.addEventListener(&quot;mouseenter&quot;, () =&gt; {
          if (!pinnedId &amp;&amp; openId !== id) {
            openId = id;
            renderPopover();
          }
        });

        button.addEventListener(&quot;focus&quot;, () =&gt; {
          if (!pinnedId &amp;&amp; openId !== id) {
            openId = id;
            renderPopover();
          }
        });

        row.addEventListener(&quot;mouseleave&quot;, () =&gt; {
          if (!pinnedId &amp;&amp; openId === id) {
            openId = &quot;&quot;;
            renderPopover();
          }
        });

        button.addEventListener(&quot;click&quot;, () =&gt; {
          if (pinnedId === id) {
            pinnedId = &quot;&quot;;
            openId = &quot;&quot;;
          } else {
            pinnedId = id;
            openId = id;
          }
          renderPopover();
          const next = content.querySelector(`[data-help-id=&quot;${id}&quot;]`);
          if (next) next.focus();
        });
      });
    };

    const render = () =&gt; {
      modal.classList.toggle(&quot;panel-mode&quot;, activePattern === &quot;panel&quot;);
      patternButtons.forEach((button) =&gt; {
        button.setAttribute(&quot;aria-pressed&quot;, String(button.dataset.pattern === activePattern));
      });

      if (activePattern === &quot;popover&quot;) {
        summary.textContent = &quot;Fast to scan; works with hover, keyboard focus, click, and tap.&quot;;
        openId = openId || &quot;financial-exploitation&quot;;
        pinnedId = pinnedId || &quot;financial-exploitation&quot;;
        renderPopover();
      } else if (activePattern === &quot;inline&quot;) {
        summary.textContent = &quot;Best when guidance needs a few lines and must remain visible while reading.&quot;;
        openId = openId || &quot;financial-exploitation&quot;;
        renderInline();
      } else {
        summary.textContent = &quot;Best for longer guidance, examples, citations, or jurisdiction-specific notes.&quot;;
        renderPanel();
      }
    };

    patternButtons.forEach((button) =&gt; {
      button.addEventListener(&quot;click&quot;, () =&gt; {
        activePattern = button.dataset.pattern;
        pinnedId = activePattern === &quot;popover&quot; ? &quot;financial-exploitation&quot; : &quot;&quot;;
        openId = &quot;financial-exploitation&quot;;
        render();
      });
    });

    root.addEventListener(&quot;keydown&quot;, (event) =&gt; {
      if (event.key === &quot;Escape&quot; &amp;&amp; activePattern === &quot;popover&quot;) {
        pinnedId = &quot;&quot;;
        openId = &quot;&quot;;
        renderPopover();
      }
    });

    root.addEventListener(&quot;click&quot;, (event) =&gt; {
      if (activePattern !== &quot;popover&quot; || !pinnedId) return;
      const target = event.target;
      if (!(target instanceof Element)) return;
      if (target.closest(&quot;[data-help-id]&quot;) || target.closest(&quot;.definition-popover&quot;)) return;
      pinnedId = &quot;&quot;;
      openId = &quot;&quot;;
      renderPopover();
    });

    render();
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;

    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)

    );

      ids.add(tooltipId);
    } else {

    }

    } else {

    if (openTimeout != null) {

    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {

    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
